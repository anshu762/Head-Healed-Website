<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Soothing Cream to Mint -->
    <linearGradient id="hh-tile-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7FAF8"/>
      <stop offset="100%" stop-color="#E2EFE6"/>
    </linearGradient>

    <!-- Heart Glow Fill -->
    <linearGradient id="hh-heart-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8C8B0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7FA9C9" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="hh-soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#2D4D36" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile (Works perfectly on Light, Dark, and High-Contrast Browser Tabs) -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="url(#hh-tile-grad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="none" stroke="#A8C8B0" stroke-width="1.8"/>

  <!-- Inner Healing Heart Emblem (Soft Aura) -->
  <path d="M32 49 C32 49 18 39.5 18 29.5 C18 23.8 22.4 19.5 27.5 19.5 C30.2 19.5 31.4 21 32 22 C32.6 21 33.8 19.5 36.5 19.5 C41.6 19.5 46 23.8 46 29.5 C46 39.5 32 49 32 49 Z"
        fill="url(#hh-heart-glow)"/>

  <!-- Healing Heart Outline (Deep Forest Sage for High Contrast & Definition) -->
  <path d="M32 49 C32 49 18 39.5 18 29.5 C18 23.8 22.4 19.5 27.5 19.5 C30.2 19.5 31.4 21 32 22 C32.6 21 33.8 19.5 36.5 19.5 C41.6 19.5 46 23.8 46 29.5 C46 39.5 32 49 32 49 Z"
        fill="none"
        stroke="#335C3E"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Central Sprout Stem: Rooted in the heart and rising -->
  <path d="M32 49 V23"
        stroke="#335C3E"
        stroke-width="3.2"
        stroke-linecap="round"/>

  <!-- Left Sprout Leaf (Healed - Sage Green) -->
  <path d="M32 35 C27 34 20.5 30 20 22 C26.5 22 31 27.5 32 35 Z"
        fill="#477053"
        stroke="#335C3E"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <!-- Right Sprout Leaf (Heard - Gentle Slate Blue) -->
  <path d="M32 31 C37 30 43.5 26 44 18 C37.5 18 33 23.5 32 31 Z"
        fill="#5C88A8"
        stroke="#3B6785"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <!-- Golden Dewdrop / Morning Sun Accent of Hope -->
  <circle cx="32" cy="18" r="2.5" fill="#F7D774" stroke="#D8A826" stroke-width="0.8"/>
</svg>